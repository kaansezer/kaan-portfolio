# Kurulum: bu dosyayı /etc/nginx/sites-available/kaan olarak kopyala,
# kaansezer.com yerine kendi domainini yaz:
#   sudo cp deploy/nginx-kaan.conf /etc/nginx/sites-available/kaan
#   sudo nano /etc/nginx/sites-available/kaan   # domainleri düzenle
#   sudo ln -s /etc/nginx/sites-available/kaan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kaansezer.com -d www.kaansezer.com

server {
    listen 80;
    server_name kaansezer.com www.kaansezer.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
